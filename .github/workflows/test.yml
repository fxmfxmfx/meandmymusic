name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_soulseek:
        description: 'Create one disposable Soulseek account and verify register/logout/login'
        type: boolean
        default: false
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check app/static/app.js
      - run: npm ci && npm test
      - name: Install browser for interaction tests
        run: npx playwright install --with-deps chromium --only-shell
      - name: Verify native drag, file operations and themes in Chromium
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example -f compose.yaml -f compose.proxmox.yaml config --quiet
      - name: Start actual Compose stack
        run: |
          python3 scripts/setup.py
          docker compose up -d --build --wait --wait-timeout 120
      - name: Verify pinned slskd API and RAM configuration
        run: MMM_TEST_SLSKD=1 python -m pytest -q tests/test_slskd_container.py
      - name: Verify registration and login on the public Soulseek network
        if: github.event_name == 'workflow_dispatch' && inputs.live_soulseek
        run: python scripts/check_soulseek_login.py
      - name: Stop test stack
        if: always()
        run: docker compose down || true
