name: Test
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check app/static/app.js
      - run: npm ci && npm test
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example -f compose.yaml -f compose.proxmox.yaml config --quiet
      - name: Start actual Compose stack
        run: |
          python3 scripts/setup.py
          docker compose up -d --build --wait --wait-timeout 120
      - name: Verify pinned slskd API and RAM configuration
        run: MMM_TEST_SLSKD=1 python -m pytest -q tests/test_slskd_container.py
      - name: Stop test stack
        if: always()
        run: docker compose down || true
